name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your Infoclimat key nor the coordinates of your home.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.2.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Infoclimat, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Station identifiers and result of "Diagnostic"
      description: The identifiers of your stations (000P2, STATIC0095…), and the "Infoclimat diagnostic" lines written to the logs of the integration by the "Diagnostic" button (no key in them).
      render: text
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. The logs never contain the key nor the coordinates.
      render: text
